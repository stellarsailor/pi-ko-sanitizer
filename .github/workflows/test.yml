name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pi itself requires Node >= 22.19.0, so this is the oldest supported floor.
          node-version: '22.19.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
